version: '3.8'

services:
  app:
    build:
      context: ./movie-management-backend
      dockerfile: Dockerfile
    container_name: movie-management-app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/movie_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
      - JWT_SECRET=your_jwt_secret_key_here_make_it_long_and_secure_in_production
      - JWT_EXPIRATION=86400000
      - OMDB_API_KEY=6c024499
      - OMDB_API_URL=http://www.omdbapi.com
    networks:
      - movie-network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: movie-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=movie_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - movie-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  movie-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local